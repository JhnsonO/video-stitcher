[workspace]
resolver = "3"
members = [
    "crates/reco-core",
    "crates/reco-cli",
    "crates/reco-io",
    "crates/reco-autocam",
    "crates/reco-calibrate",
    "crates/reco-control",
    "crates/reco-detect",
    "crates/reco-gui",
    "crates/reco-obs",
]
# The `fuzz` subcrate is intentionally out of the workspace because
# libfuzzer-sys requires nightly-specific compiler flags that would
# otherwise constrain the rest of the workspace. Run targets via
# `cargo +nightly fuzz run <target>` from the fuzz/ directory.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
repository = "https://github.com/reco-project/video-stitcher"

[workspace.dependencies]
tracing = "0.1"
# tracing-subscriber + env-filter: structured log output with RUST_LOG-
# style filtering, feature-gated JSON emit for diagnostic bundles.
# tracing-log: auto-bridges legacy `log::*` macro calls to tracing so
# existing call sites in reco-core / reco-io / reco-calibrate keep
# working while we migrate incrementally. Registered once per binary.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "tracing-log"] }
tracing-log = "0.2"

[profile.release]
strip = true
lto = "thin"

# SPIKE: wgpu 28 interop with Slint. Fork removed; if wgpu 28 doesn't
# have the shaderDrawParameters regression, no patch is needed.

# Compile-only proof (ticket 1c): 1b proved that patching wgpu-hal's
# SOURCE alone while leaving wgpu/wgpu-core/wgpu-types on crates.io
# produces two incompatible copies of wgpu-types in the graph (rustc
# E0308 "two different versions of crate `wgpu_types`"), because the
# forked wgpu-hal pulls its own workspace-locked wgpu-types from the
# fork's monorepo. Patching the whole tightly-coupled quartet to the
# same fork/rev keeps a single wgpu-types instance. Versions are
# unchanged (all four resolve at their existing 28.0.x); only source
# is redirected. Diagnostic-only: no zero-copy behavioral change, no
# CUDA semaphore usage yet.
[patch.crates-io]
wgpu       = { git = "https://github.com/JhnsonO/wgpu", rev = "0750ea88863e6e4e8acd9128ce820d71f44e968f" }
wgpu-core  = { git = "https://github.com/JhnsonO/wgpu", rev = "0750ea88863e6e4e8acd9128ce820d71f44e968f" }
wgpu-hal   = { git = "https://github.com/JhnsonO/wgpu", rev = "0750ea88863e6e4e8acd9128ce820d71f44e968f" }
wgpu-types = { git = "https://github.com/JhnsonO/wgpu", rev = "0750ea88863e6e4e8acd9128ce820d71f44e968f" }
