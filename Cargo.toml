[workspace]
resolver = "3"
members = [
    "crates/reco-core",
    "crates/reco-cli",
    "crates/reco-io",
    "crates/reco-autocam",
    "crates/reco-calibrate",
    "crates/reco-control",
    "crates/reco-detect",
    "crates/reco-gui",
    "crates/reco-obs",
]
# The `fuzz` subcrate is intentionally out of the workspace because
# libfuzzer-sys requires nightly-specific compiler flags that would
# otherwise constrain the rest of the workspace. Run targets via
# `cargo +nightly fuzz run <target>` from the fuzz/ directory.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
repository = "https://github.com/reco-project/video-stitcher"

[workspace.dependencies]
tracing = "0.1"
# tracing-subscriber + env-filter: structured log output with RUST_LOG-
# style filtering, feature-gated JSON emit for diagnostic bundles.
# tracing-log: auto-bridges legacy `log::*` macro calls to tracing so
# existing call sites in reco-core / reco-io / reco-calibrate keep
# working while we migrate incrementally. Registered once per binary.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "tracing-log"] }
tracing-log = "0.2"

[profile.release]
strip = true
lto = "thin"

# Linux CUDA/Vulkan shared-buffer interop needs the Vulkan queue wait
# backport plus VK_KHR_external_semaphore_fd enablement. Keep the tightly
# coupled wgpu quartet on one source/revision to avoid duplicate wgpu-types.
[patch.crates-io]
wgpu       = { git = "https://github.com/JhnsonO/wgpu", rev = "d74e00f2415e55c0f09a87b0497d66d8192a44bb" }
wgpu-core  = { git = "https://github.com/JhnsonO/wgpu", rev = "d74e00f2415e55c0f09a87b0497d66d8192a44bb" }
wgpu-hal   = { git = "https://github.com/JhnsonO/wgpu", rev = "d74e00f2415e55c0f09a87b0497d66d8192a44bb" }
wgpu-types = { git = "https://github.com/JhnsonO/wgpu", rev = "d74e00f2415e55c0f09a87b0497d66d8192a44bb" }
