name: Option 1 async CUDA Vulkan slot handoff

on:
  push:
    branches:
      - feature/async-vulkan-buffer-completion
    paths:
      - .github/workflows/option1-async-completion-impl.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/async-vulkan-buffer-completion
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config clang libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev

      - name: Apply bounded option1 source changes
        run: |
          python3 scripts/option1_async_completion_impl.py
          python3 scripts/option1_async_completion_compile_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Diff scope
        run: |
          git status --short
          git diff --stat
          git diff --check

      - name: Locked CUDA release check
        run: cargo check --release --locked -p reco-cli --features cuda

      - name: Targeted NV12 P010 copy alignment test
        run: cargo test --locked -p reco-core nv12_and_p010_plane_pitches_are_copy_aligned -- --nocapture

      - name: Commit proven source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/reco-core/src/interop/cuda.rs \
                  crates/reco-core/src/interop/vulkan.rs \
                  crates/reco-core/src/interop/zero_copy.rs \
                  crates/reco-core/src/session/frame_processing.rs \
                  crates/reco-core/src/session/mod.rs \
                  crates/reco-core/src/session/run_loop.rs \
                  crates/reco-core/src/session/zero_copy_linux.rs \
                  crates/reco-io/src/smart_source.rs \
                  crates/reco-io/src/zero_copy.rs
          git commit -m 'perf: async CUDA Vulkan decode-slot handoff'
          git push origin HEAD:feature/async-vulkan-buffer-completion
