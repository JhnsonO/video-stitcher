name: Option 1 — async CUDA/Vulkan slot handoff implementation

on:
  push:
    branches:
      - feature/async-vulkan-buffer-completion
    paths:
      - .github/workflows/option1-async-completion-impl.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/async-vulkan-buffer-completion
          fetch-depth: 0

      - name: Apply bounded option-1 implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new, count))

