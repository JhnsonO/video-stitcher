          # Sanity: the two targeted frame-loop blocking polls must be gone.
          fp = Path('crates/reco-core/src/session/frame_processing.rs').read_text()
          if 'gpu.queue.submit(std::iter::once(command));\n        let _ = gpu.device.poll(wgpu::PollType::wait_indefinitely());' in fp:
              raise SystemExit('per-frame buffer-copy blocking poll still present')
          vk = Path('crates/reco-core/src/interop/vulkan.rs').read_text()
          if 'wait for skipped-frame semaphore consumption' in vk:
              raise SystemExit('skipped-frame blocking poll still present')
          PY

