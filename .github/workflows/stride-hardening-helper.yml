name: Stride hardening helper

on:
  push:
    branches: [feature/frame-stride-testing]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stride-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feature/frame-stride-testing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Restore experimental source edits to production baseline
        run: |
          git fetch origin main --depth=1
          git show origin/main:crates/reco-io/src/smart_source.rs > crates/reco-io/src/smart_source.rs
          git show origin/main:crates/reco-autocam/src/lib.rs > crates/reco-autocam/src/lib.rs
      - name: Apply production stride architecture
        run: python3 tools/apply_stride_hardening.py
      - name: Format and sanity check
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Commit production hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/reco-autocam/src/lib.rs \
                  crates/reco-io/src/smart_source.rs \
                  crates/reco-core/src/session/mod.rs \
                  crates/reco-core/src/session/wiring.rs \
                  crates/reco-core/src/session/frame_buffer.rs \
                  crates/reco-core/src/session/detection_dispatch.rs \
                  crates/reco-core/src/session/run_loop.rs \
                  crates/reco-cli/src/main.rs \
                  crates/reco-cli/src/stitch.rs
          git diff --cached --stat
          git commit -m "feat: full-rate render with sparse AI analysis [stride-hardening]"
          git push origin HEAD:feature/frame-stride-testing
