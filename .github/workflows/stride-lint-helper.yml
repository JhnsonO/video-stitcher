name: Stride lint cleanup helper

on:
  push:
    branches: [feature/frame-stride-testing]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stride-lint-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feature/frame-stride-testing
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt,clippy
      - uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05
        with:
          packages: libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev libavfilter-dev libswresample-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfontconfig1-dev libobs-dev pkg-config clang
      - name: Apply lint cleanup
        run: python3 tools/fix_stride_clippy.py
      - name: Verify branch-local lint is clean
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cargo check -p reco-core
          cargo check -p reco-cli --no-default-features
          cargo test -p reco-core frame_stride_tests --lib
          cargo test -p reco-core sparse_future_states_exclude_render_only_duplicates --lib
          set +e
          cargo clippy -p reco-core --lib -- -D warnings 2>&1 | tee /tmp/clippy.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -E 'session/(detection_dispatch|run_loop)\.rs' /tmp/clippy.log; then
            echo '::error::Frame-stride files still have clippy failures'
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            grep -q 'session/vram_pool.rs' /tmp/clippy.log || {
              echo '::error::Clippy failed for an unexpected reason'; cat /tmp/clippy.log; exit 1;
            }
            echo 'Only the pre-existing vram_pool.rs lint remains.'
          fi
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/reco-core/src/session/detection_dispatch.rs crates/reco-core/src/session/run_loop.rs
          git commit -m "fix: clean sparse analysis lint [stride-lint-clean]"
          git push origin HEAD:feature/frame-stride-testing
