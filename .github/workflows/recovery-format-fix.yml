name: Recovery format fix

on:
  push:
    branches: [agent/high-res-ball-roi-recovery]
    paths: [.recovery-format-fix]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/high-res-ball-roi-recovery
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Format recovery code
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/reco-autocam/src/recovery_filter.rs
          git commit -m 'style: format recovery validator'
          git push origin HEAD:agent/high-res-ball-roi-recovery
