name: Recovery branch fixup

on:
  push:
    branches: [agent/high-res-ball-roi-recovery]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-fix-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/high-res-ball-roi-recovery
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Apply compile cleanup
        run: python3 tools/fix_recovery_branch.py
      - name: Format and verify diff
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/reco-detect/src/detectors/ort_gpu.rs crates/reco-autocam/src/lib.rs crates/reco-autocam/src/recovery_filter.rs
          git commit -m "fix: compile recovery commit boundary [recovery-fix-clean]"
          git push origin HEAD:agent/high-res-ball-roi-recovery
